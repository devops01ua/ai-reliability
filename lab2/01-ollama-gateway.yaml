# Dedicated LLM gateway for the Ollama OpenAI-compatible proxy, plus the route
# that sends all traffic on this gateway to the Ollama AI backend.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ollama-llm
  namespace: lab2
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-route
  namespace: lab2
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ollama-llm
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: ollama-backend
