apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: ollama-agent
  namespace: lab2
spec:
  description: A demo agent backed by local Ollama with the server-everything MCP tools.
  declarative:
    modelConfig: ollama-model-config
    stream: true
    systemMessage: |
      You are a helpful assistant running on a local Ollama model.
      You have access to MCP tools from the server-everything reference server.
      Use the `echo` tool to repeat text back, and the `add` tool to sum two numbers.
      Prefer using a tool when the user's request maps directly to one.
    tools:
    - type: McpServer
      mcpServer:
        kind: MCPServer
        apiGroup: kagent.dev
        name: everything-mcp
        toolNames:
        - echo
        - add
    a2aConfig:
      skills:
      - id: echo-text
        name: Echo Text
        description: Repeat a provided message back to the user using the MCP echo tool.
        tags:
        - echo
        - demo
        examples:
        - "Echo: hello world"
        - "Repeat this back to me: testing 123"
      - id: add-numbers
        name: Add Numbers
        description: Add two numbers using the MCP add tool.
        tags:
        - math
        - demo
        examples:
        - "What is 2 + 2?"
        - "Add 17 and 25."
    deployment:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
